<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - TaqyeemPro</title>
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1 class="auth-title">Welcome Back 👋</h1>
      <p class="auth-subtitle">Sign in to your TaqyeemPro account</p>

      <div class="user-type-toggle">
        <label><input type="radio" name="userType" checked /> Student</label>
        <label><input type="radio" name="userType" /> Moderator</label>
      </div>

      <form class="auth-form">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <p class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </form>
    </div>
  </div>
</body>
</html>
