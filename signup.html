<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - TaqyeemPro</title>
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1 class="auth-title">Join TaqyeemPro 🎓</h1>
      <p class="auth-subtitle">Create your account now to get started</p>
      <form class="auth-form">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <p class="auth-footer">Already have an account? <a href="signin.html">Sign In</a></p>
      </form>
    </div>
  </div>
</body>
</html>
